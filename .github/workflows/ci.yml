name: CI

'on':
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: melophile_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d melophile_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/melophile_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Content checks
        run: npm run check --workspace backend

      - name: Prepare database schema
        run: npm run db:migrate --workspace backend

      - name: Build
        run: npm run build
